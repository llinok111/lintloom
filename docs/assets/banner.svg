<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="LintLoom — sqlfluff 的可执行可视化工作台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1310"/>
      <stop offset="0.55" stop-color="#14100e"/>
      <stop offset="1" stop-color="#221a14"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d3a0"/>
      <stop offset="0.5" stop-color="#e0a45c"/>
      <stop offset="1" stop-color="#c4674b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#e0a45c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0a45c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a45c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c4674b" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="1" fill="#e0a45c" opacity="0.25"/>
  <rect x="0" y="319" width="1280" height="1" fill="#3a2d24"/>

  <!-- 织线标识：loom 的隐喻（经线 × 一条纬线穿过） -->
  <g transform="translate(56,58)">
    <rect x="0" y="0" width="4" height="46" rx="2" fill="url(#thread)"/>
    <rect x="12" y="6" width="4" height="40" rx="2" fill="url(#thread)" opacity="0.8"/>
    <rect x="24" y="12" width="4" height="34" rx="2" fill="url(#thread)" opacity="0.62"/>
    <rect x="36" y="18" width="4" height="28" rx="2" fill="url(#thread)" opacity="0.46"/>
    <rect x="-8" y="20" width="60" height="4" rx="2" fill="#f2c98d" opacity="0.95"/>
  </g>

  <text x="56" y="152" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="84" font-weight="700" letter-spacing="1" fill="url(#word)">LintLoom</text>
  <text x="58" y="196" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" fill="#e6d5c5">把 sqlfluff 的诊断 / 修复 / 解析做成可点击的工作台</text>
  <text x="58" y="226" font-family="Consolas, Cascadia Mono, monospace" font-size="16" fill="#a08e7e">诊断 → 修复预览 → 写回 → 复核　·　每一步都是真实子进程</text>

  <g font-family="Consolas, Cascadia Mono, monospace" font-size="14">
    <rect x="56" y="250" width="128" height="34" rx="17" fill="#221a15" stroke="#b8783f" stroke-opacity="0.55"/>
    <text x="120" y="272" text-anchor="middle" fill="#f2c98d">100 tests</text>

    <rect x="196" y="250" width="112" height="34" rx="17" fill="#221a15" stroke="#3a2d24"/>
    <text x="252" y="272" text-anchor="middle" fill="#d8c7b6">MIT</text>

    <rect x="320" y="250" width="176" height="34" rx="17" fill="#221a15" stroke="#3a2d24"/>
    <text x="408" y="272" text-anchor="middle" fill="#d8c7b6">sqlfluff 4.4.0</text>

    <rect x="508" y="250" width="150" height="34" rx="17" fill="#221a15" stroke="#3a2d24"/>
    <text x="583" y="272" text-anchor="middle" fill="#d8c7b6">零前端依赖</text>
  </g>

  <!-- 右侧：真实终端片段 -->
  <g>
    <rect x="828" y="62" width="396" height="196" rx="14" fill="#17120f" stroke="#3a2d24"/>
    <rect x="828" y="62" width="396" height="34" rx="14" fill="#221a15"/>
    <rect x="828" y="82" width="396" height="14" fill="#221a15"/>
    <circle cx="852" cy="79" r="4.5" fill="#c4674b"/>
    <circle cx="868" cy="79" r="4.5" fill="#d9b45f"/>
    <circle cx="884" cy="79" r="4.5" fill="#8faa6f"/>
    <text x="1200" y="84" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#7a6759">sqlfluff · ansi</text>

    <g font-family="Consolas, Cascadia Mono, monospace" font-size="13.5">
      <text x="850" y="128" fill="#e0a45c">$ python -m sqlfluff lint orders.sql -d ansi</text>
      <text x="850" y="156" fill="#a08e7e">L:1  P:1   <tspan fill="#f2c98d">LT09</tspan>  select targets on new line</text>
      <text x="850" y="182" fill="#a08e7e">L:1  P:1   <tspan fill="#f2c98d">AL01</tspan>  implicit table alias</text>
      <text x="850" y="208" fill="#a08e7e">L:2  P:22  <tspan fill="#f2c98d">LT01</tspan>  expected single whitespace</text>
      <text x="850" y="238" fill="#8faa6f">14 violations · 15 fixable · 0.35s</text>
    </g>
  </g>
</svg>
